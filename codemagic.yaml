workflows:
  android-release:
    name: Android Release APK & Bundle
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - release_credentials
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: "*"
          include: true
          source: true
    scripts:
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$CM_KEYSTORE_PASSWORD" \
            "keyPassword=$CM_KEY_PASSWORD" \
            "keyAlias=$CM_KEY_ALIAS" \
            "storeFile=upload-keystore.jks" \
            > "$CM_BUILD_DIR/android/key.properties"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build release APK and app bundle
        script: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Publish to GitHub
        script: |
          # Use tag name when build is tag-triggered; otherwise create release-$BUILD_NUMBER
          if [ -n "$CM_TAG" ]; then
            RELEASE_TAG="$CM_TAG"
          else
            RELEASE_TAG="release-$PROJECT_BUILD_NUMBER"
          fi

          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"

          gh release create "$RELEASE_TAG" \
            --repo Aliafzal323/Trendy-threads \
            --title "Android Release $RELEASE_TAG" \
            --notes "Release Android APK and App Bundle" \
            "$APK" \
            "$AAB"
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
