workflows:
  android-release:
    name: Android Release APK & Bundle
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$CM_KEYSTORE_PASSWORD" \
            "keyPassword=$CM_KEY_PASSWORD" \
            "keyAlias=$CM_KEY_ALIAS" \
            "storeFile=upload-keystore.jks" \
            > "$CM_BUILD_DIR/android/key.properties"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build release APK and app bundle
        script: |
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
    publishing:
      github:
        auth:
          personal_access_token: $GITHUB_TOKEN
        repository: Aliafzal323/Trendy-threads
        tag_name: release-$PROJECT_BUILD_NUMBER
        title: Android Release $PROJECT_BUILD_NUMBER
        description: Release Android APK and App Bundle
